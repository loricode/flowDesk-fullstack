name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet test backend/FlowDesk.Tests -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: '**/TestResults/*.trx' }

  desktop:
    name: Escritorio (WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet publish desktop/FlowDesk.Desktop -c Release -r win-x64 --self-contained false -o publish/desktop
      - uses: actions/upload-artifact@v4
        with: { name: flowdesk-capture, path: publish/desktop }

  frontend:
    name: Frontend (React + MUI)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: dotnet build backend/FlowDesk.API
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e/playwright
      - run: npx playwright test
        working-directory: e2e/playwright
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright/playwright-report }
